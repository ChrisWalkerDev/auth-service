name = "auth-service-chriswalkerdev"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve the Worker on its own subdomain (the zone must be on this Cloudflare account).
routes = [{ pattern = "auth.chriswalker.dev", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "auth-chriswalker-db"
# Replace with the id printed by `npx wrangler d1 create auth-chriswalker-db`
database_id = "3e93309e-3385-482f-bd6e-260478d69d9b"
migrations_dir = "migrations"

# Bundle HTML templates and CSS (src/templates) into the Worker as text modules.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css"]
fallthrough = true

[vars]
LOGO_URL='https://chriswalker.dev/favicon.svg'
PUBLIC_URL = "https://auth.chriswalker.dev"
# Sites users may be sent back to after login (via /?redirect=...).
TRUSTED_ORIGINS = "https://chriswalker.dev,https://*.chriswalker.dev"
DISABLE_SIGNUP = "false"
BOOTSTRAP_ADMIN_EMAIL = "chriswalkerdev@gmail.com"

# Secrets (set per deployment, never put them here):
#   npx wrangler secret put BETTER_AUTH_SECRET -c wrangler.chriswalker.toml
#   npx wrangler secret put GOOGLE_CLIENT_ID -c wrangler.chriswalker.toml   (and GOOGLE_CLIENT_SECRET)
# Google redirect URI to register: https://auth.chriswalker.dev/api/auth/callback/google

[limits]
cpu_ms = 1000

[secrets]
required = ["BETTER_AUTH_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET"]