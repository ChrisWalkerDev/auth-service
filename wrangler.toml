name = "auth-service"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "auth-service-db"
# Replace with the id printed by `npx wrangler d1 create auth-service-db`
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Bundle HTML templates and CSS (src/templates) into the Worker as text modules.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css"]
fallthrough = true

[vars]
# Public origin of the deployed app (no trailing slash). Used as the Better Auth baseURL.
PUBLIC_URL = "http://localhost:8787"
# Deployments override these in their own config, e.g. `wrangler deploy -c wrangler.<tenant>.toml`.
# Comma-separated origins users may be sent back to after login (via /?redirect=...).
# Supports wildcard subdomains, e.g. "https://example.com,https://*.example.com". Empty = this service only.
TRUSTED_ORIGINS = ""
# Set to "true" to make the app invite-only (no public sign-up).
DISABLE_SIGNUP = "false"
# Optional: https URL (or site-relative path) of the logo shown on the login page. Empty = built-in mark.
# The logo's origin is added to the page's img-src Content Security Policy automatically.
LOGO_URL = ""
# Optional: the first registration with this email becomes admin if no admin exists yet.
# Leave empty and use the SQL bootstrap instead if you prefer.
BOOTSTRAP_ADMIN_EMAIL = ""

# Secrets (never put these here):
#   BETTER_AUTH_SECRET -> `npx wrangler secret put BETTER_AUTH_SECRET`
#   local dev           -> .dev.vars (git-ignored)
